<!DOCTYPE html>
<head>
    <title>Preferencias del Operador - ALBOR LOGISTICS</title>
    <style>

        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        h1, h2 { color: #1e3a8a; }
        .box { background: white; padding: 15px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 15px; }
        .field { margin-bottom: 10px; }
        label { display: inline-block; width: 180px; font-weight: bold; }
        input, select { padding: 5px; width: 180px; }
        .btn-group { margin-top: 15px; }
        button { padding: 8px 12px; margin-right: 5px; cursor: pointer; }
        .error { color: red; margin-top: 5px; }
        .resumen { background: #e0f2fe; padding: 10px; border-left: 4px solid #0284c7; }
    </style>

</head>
<body>

    <h1>ALBOR LOGISTICS - Preferencias del Operador</h1>

    <div class="box">
        <form id="formPref">
            <h2>Configurar Preferencias</h2>
            <div class="field">
                <label for="nombre">Nombre del operador:</label>
                <input type="text" id="nombre" placeholder="Carlos">
            </div>

            <div class="field">
                <label for="idioma">Idioma:</label>
                <select id="idioma">
                    <option value="Español">Español</option>
                    <option value="Inglés">Inglés</option>
                </select>
            </div>

            <div class="field">
                <label for="numViajes">Viajes a visualizar:</label>
                <select id="numViajes">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>

            <div class="field">
                <label for="ultimoPanel">Último panel:</label>
                <select id="ultimoPanel">
                    <option value="Viajes">Viajes</option>
                    <option value="Camiones">Camiones</option>
                    <option value="Conductores">Conductores</option>
                    <option value="Clientes">Clientes</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="button" id="btnGuardar">Guardar preferencias</button>
                <button type="button" id="btnConsultar">Consultar preferencias</button>
                <button type="button" id="btnEliminar">Eliminar preferencias</button>
                <button type="button" id="btnRestablecer">Restablecer</button>
            </div>
            
            <div id="mensajeError" class="error"></div>
        </form>
    </div>

    <div class="box">
        <h2>Estado Actual</h2>
        <div id="pantallaEstado"></div>
    </div>

    <script src="js/cookies.js"></script>
</body>
</html>
