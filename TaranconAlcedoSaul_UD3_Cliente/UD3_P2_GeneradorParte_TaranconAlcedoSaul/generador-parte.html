<!DOCTYPE html>
<head>
    <title>Generador de Parte de Viaje - ALBOR LOGISTICS</title>
    <style>

        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        h1, h2 { color: #1e3a8a; }
        .box { background: white; padding: 15px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 15px; }
        .field { margin-bottom: 10px; }
        label { display: inline-block; width: 130px; font-weight: bold; }
        input, select { padding: 5px; width: 200px; }
        button { padding: 8px 12px; cursor: pointer; }
        .parte-res { border: 2px solid #1e3a8a; padding: 15px; background-color: #fff; margin-top: 10px; }
        .error { color: red; margin-top: 5px; }

    </style>
</head>
<body>

    <h1>ALBOR LOGISTICS - Generador de Parte</h1>

    <div class="box">

        <h2>Datos del Viaje</h2>
        <div class="field"><label>Código viaje:</label><input type="text" id="codigo" placeholder="VIA-001"></div>
        <div class="field"><label>Matrícula:</label><input type="text" id="matricula" placeholder="1234ABC"></div>
        <div class="field"><label>Conductor:</label><input type="text" id="conductor" placeholder="Juan García"></div>
        <div class="field"><label>Origen:</label><input type="text" id="origen" placeholder="Jerez"></div>
        <div class="field"><label>Destino:</label><input type="text" id="destino" placeholder="Madrid"></div>
        <div class="field"><label>Distancia (km):</label><input type="number" id="distancia" placeholder="640"></div>
        <div class="field">

            <label>Estado:</label>
            <select id="estado">

                <option value="">-- Seleccionar --</option>
                <option value="EN RUTA">EN RUTA</option>
                <option value="PENDIENTE">PENDIENTE</option>
                <option value="FINALIZADO">FINALIZADO</option>

            </select>
        </div>

        <button id="btnGenerar">Generar parte</button>
        <div id="mensajeError" class="error"></div>

    </div>
    <div class="box">
        <h2>Parte Generado</h2>
        <div id="contenedorParte">
            <p>Rellena los datos para ver el parte de viaje aquí.</p>
        </div>
        <br>
        <button id="btnAbrirVentana" style="display: none;">Abrir parte en nueva ventana</button>
    </div>
    <script src="js/parte.js"></script>
</body>
</html>
