<!DOCTYPE html>
<html>

<head>

    <title>Clasificador de Viajes de ALBOR LOGISTICS</title>

</head>

<body>

<h1><center><b>ALBOR LOGISTICS</b></center></h1>
<center><p>Clasificador de viajes</p></center>
<hr>

<div>

<p><b>Código del viaje</b></p>
<input type = "text" id = "codigo">

<p><b>Matrícula del camión</b></p>
<input type = "text" id = "matricula">

<p><b>Ciudad de origen</b></p>
<input type = "text" id = "origen">

<p><b>Ciudad de destino</b></p>
<input type = "text" id = "destino">

<p><b>Estado del viaje</b></p>
<input type = "text" id = "estado" placeholder = "ej: pendiente, asignado, en_ruta.."> <!-- el placeholder es un texto de ayuda que cuando empieze a escribir desaparece-->

<button onclick="clasificarViaje()">Clasificar Viaje</button>
    
<p id="resultado"></p> <!-- Para mostrar el resultado con JS -->

</div>
<script src="js/app.js"></script>
</body>

</html>
