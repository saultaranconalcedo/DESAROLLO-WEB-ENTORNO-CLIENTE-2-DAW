<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de camiones</title>
</head>
<body>
    <h1>ALBOR LOGISTICS</h1>
    <h2>GESTIÓN DE FLOTA</h2>
    <hr>

    <p>
        <button id="todos">Mostrar todos</button>
        <button id="disponibles">Mostrar disponibles</button>
        <button id="enRuta">Mostrar en ruta</button>
        <button id="mantenimiento">Contar mantenimiento</button>
    </p>
    <p>
        Matrícula: <input type="text" id="matriculaBuscar">
        <button id="buscar">Buscar camión</button>
    </p>
    <p>
        Matrícula: <input type="text" id="matriculaKilometros">
        Kilómetros: <input type="number" id="kilometrosNuevos" min="0">
        <button id="anadirKilometros">Añadir kilómetros</button>
    </p>
    <p id="mensaje"></p>
    <div id="resultado"></div>

    <script src="js/camion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
