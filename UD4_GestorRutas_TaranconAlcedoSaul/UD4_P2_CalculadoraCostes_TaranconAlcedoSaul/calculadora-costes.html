<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de costes</title>
</head>
<body>
    <h1>ALBOR LOGISTICS</h1>
    <h2>CALCULADORA DE COSTES</h2>
    <hr>

    <p>Distancia (km): <input type="number" id="distancia" value="640" min="1"></p>
    <p>Consumo (litros/100 km): <input type="number" id="consumo" value="30" min="0"></p>
    <p>Precio combustible (€/l): <input type="number" id="precio" value="1.45" min="0" step="0.01"></p>
    <p>Coste peajes (€): <input type="number" id="peajes" value="75" min="0" step="0.01"></p>
    <p>Coste adicional (€): <input type="number" id="adicionales" value="40" min="0" step="0.01"></p>
    <button id="calcular">Calcular costes</button>
    <p id="error" style="color: red;"></p>
    <div id="resultado"></div>

    <script src="js/costes.js"></script>
</body>
</html>
